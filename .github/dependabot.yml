# Directories here are relative to the REPOSITORY ROOT.
#
# This file used to live at packages/app/.github/dependabot.yml, where GitHub
# never read it, so every directory was written as if the Flutter app were the
# whole repo ("/" for pub, "/android" for gradle). Now that it is active those
# paths would find no manifests, so they are corrected below.
#
# Not covered: supabase/functions. Those are Deno modules that pin versions
# inline in npm:/jsr: specifiers, which Dependabot does not support — they are
# reviewed by hand.
version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/packages/app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    labels: [ "dependencies", "dart" ]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      # These match nothing today — the app moved off Firebase to Supabase and
      # uses provider rather than riverpod. Kept as no-ops so grouping is
      # already in place if either returns; delete them if it does not.
      firebase:
        patterns:
          - "firebase_*"
      riverpod:
        patterns:
          - "riverpod*"
          - "flutter_riverpod"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: [ "dependencies", "ci" ]
    commit-message:
      prefix: "ci(actions)"

  - package-ecosystem: "gradle"
    directory: "/packages/app/android"
    schedule:
      interval: "monthly"
    labels: [ "dependencies", "android" ]
    commit-message:
      prefix: "chore(android)"

  # The "bundler" entry that was here is removed: packages/app/ios has no
  # Gemfile, so Dependabot would fail that update job on every run. Restore it
  # if CocoaPods/Fastlane tooling is ever added.
