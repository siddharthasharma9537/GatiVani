name: Deploy Edge Functions

# Auto-deploys Supabase edge functions when their source changes on main.
# Requires the SUPABASE_ACCESS_TOKEN repo secret — generate one at
# https://supabase.com/dashboard/account/tokens then run:
#   gh secret set SUPABASE_ACCESS_TOKEN
# Until the secret exists this workflow skips (does not fail).

on:
  push:
    branches: [main, feature/live-discovery]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: jjoxowdvzmlchtfarpbs
    steps:
      - uses: actions/checkout@v4
      - name: Skip if secret missing
        id: gate
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_ACCESS_TOKEN not set — deploy skipped"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.gate.outputs.skip != 'true'
        with:
          version: latest
      - name: Deploy all functions
        if: steps.gate.outputs.skip != 'true'
        run: |
          for fn in supabase/functions/*/; do
            name=$(basename "$fn")
            echo "Deploying $name…"
            supabase functions deploy "$name" --project-ref "$PROJECT_REF" --use-api
          done
