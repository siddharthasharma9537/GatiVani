name: CI

# Lean CI for the monorepo. The previous workflows lived in
# packages/app/.github/workflows/ where GitHub never executes them
# (workflows must be at repo root); they are preserved under
# .github/workflows-archive/ for reference.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-analyze:
    name: Flutter analyze (packages/app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        working-directory: packages/app
        run: flutter pub get
      - name: Analyze
        working-directory: packages/app
        # Informational for now — flip to blocking once the existing
        # analyzer findings are cleaned up.
        continue-on-error: true
        run: flutter analyze
      - name: Test
        working-directory: packages/app
        # Informational: the suite currently references services that do not
        # exist in lib/ (firebase_service, gemini_service, news_service) and
        # cannot compile — a pre-rewrite holdover that needs a rewrite of its
        # own against the current services.
        continue-on-error: true
        run: flutter test
