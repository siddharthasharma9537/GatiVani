name: Build & Deploy Flutter Web to Vercel

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'latest'
          cache: true
      
      - name: Get Flutter dependencies
        run: |
          cd packages/app
          flutter pub get
      
      - name: Build Flutter web
        run: |
          cd packages/app
          flutter build web --release --web-renderer html
      
      - name: Deploy to Vercel (Production)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: packages/app
      
      - name: Deploy to Vercel (Preview)
        if: github.event_name == 'pull_request'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: packages/app
          scope: ${{ secrets.VERCEL_ORG_SCOPE }}
      
      - name: Comment PR with deployment URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Vercel Preview Deployment Complete!\n\n[View Preview](https://gativani-git-${{ github.head_ref }}-${{ secrets.VERCEL_ORG_SCOPE }}.vercel.app)'
            })

  test:
    runs-on: ubuntu-latest
    needs: build-deploy
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'latest'
          cache: true
      
      - name: Run tests
        run: |
          cd packages/app
          flutter test 2>/dev/null || echo "No tests found"
      
      - name: Analyze Dart code
        run: |
          cd packages/app
          flutter analyze --no-fatal-infos

env:
  FLUTTER_VERSION: 3.19.0
